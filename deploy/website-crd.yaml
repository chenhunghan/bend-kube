# A Website: an image served by a Deployment, reconciled by
# examples/website.bend.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: websites.bend-kube.dev
spec:
  group: bend-kube.dev
  names:
    kind: Website
    plural: websites
    singular: website
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [image]
            properties:
              image:
                type: string
              replicas:
                type: integer
                minimum: 0
              port:
                type: integer
                minimum: 1
                maximum: 65535
              env:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name: {type: string}
                    value: {type: string}
          status:
            type: object
            properties:
              phase:
                type: string
              readyReplicas:
                type: integer
                minimum: 0
              observedGeneration:
                type: integer
                format: int64
